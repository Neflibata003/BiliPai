name: Build Mod APK

# 编译与官方版并存安装的 Mod 包（包名 com.android.purebilibili.mod）。
# 推送 mod/** 分支自动编译，也可手动触发；不需要 FCM 与正式签名密钥，未配置正式签名时使用 debug 签名。
on:
  push:
    branches:
      - 'mod/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: build-mod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-mod:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Resolve pinned Miuix commit
        id: miuix
        run: |
          MIUIX_VERSION=$(sed -n 's/^miuix = "\(.*\)"$/\1/p' gradle/libs.versions.toml)
          MIUIX_SHA=$(echo "$MIUIX_VERSION" | sed -n 's/^[0-9.]*-\([0-9a-f]\{7,40\}\)-SNAPSHOT$/\1/p')
          if [ -z "$MIUIX_SHA" ]; then
            echo "Cannot derive a Miuix commit from version '$MIUIX_VERSION'" >&2
            exit 1
          fi
          echo "version=$MIUIX_VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$MIUIX_SHA" >> "$GITHUB_OUTPUT"

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-miuix-${{ steps.miuix.outputs.sha }}
          restore-keys: ${{ runner.os }}-konan-

      # Miuix 的 GitHub Packages 只保留最近 10 个 SNAPSHOT，固定版本可能已被清理。
      # 从源码编译同一提交并发布到 mavenLocal：坐标、版本与 GitHub Packages 上的完全一致。
      - name: Build pinned Miuix into mavenLocal
        env:
          MIUIX_SHA: ${{ steps.miuix.outputs.sha }}
          MIUIX_VERSION: ${{ steps.miuix.outputs.version }}
        run: |
          git clone --quiet --filter=blob:none --no-checkout https://github.com/compose-miuix-ui/miuix "$RUNNER_TEMP/miuix"
          cd "$RUNNER_TEMP/miuix"
          git checkout --quiet "$MIUIX_SHA"
          # Miuix 用 git rev-parse --short 生成版本号，固定缩写长度以得到与 BiliPai 相同的版本。
          git config core.abbrev ${#MIUIX_SHA}
          test "$(git rev-parse --short HEAD)" = "$MIUIX_SHA"
          TASKS=""
          for m in miuix-core miuix-squircle miuix-material miuix-ui miuix-preference miuix-blur miuix-icons; do
            TASKS="$TASKS :$m:publishKotlinMultiplatformPublicationToMavenLocal :$m:publishAndroidPublicationToMavenLocal"
          done
          chmod +x gradlew
          ./gradlew --no-configuration-cache --parallel $TASKS
          ls "$HOME/.m2/repository/top/yukonga/miuix/kmp/"
          test -d "$HOME/.m2/repository/top/yukonga/miuix/kmp/miuix-core/$MIUIX_VERSION"

      # 可选：配置 RELEASE_KEYSTORE_BASE64 等 4 个 secrets 后用固定签名，后续版本可直接覆盖升级 Mod 包；
      # 不配置则每次使用 runner 临时 debug 签名，升级 Mod 包前需先卸载旧 Mod（官方版不受影响）。
      - name: Configure optional signing
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "BILI_RELEASE_STORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build Mod APK
        env:
          # GitHub Packages（Miuix）即使是公开包也需要 token 鉴权。
          GITHUB_TOKEN: ${{ github.token }}
          BILI_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          BILI_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          BILI_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --max-workers=4 \
            "-Pbili.build.commitSha=${{ github.sha }}" \
            "-Pbili.build.gitRef=${{ github.ref }}" \
            -Pbili.miuix.mavenLocal=true \
            assembleMod

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BiliPai-Mod
          path: app/build/outputs/bilipai/mod/*.apk
          retention-days: 7
          if-no-files-found: error
